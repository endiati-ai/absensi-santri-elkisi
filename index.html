<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#075E54">
<title>Absensi Santri eLKISI</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f7f6;
    color:#17201e;
    padding-bottom:80px;
}

.header{
    background:#075E54;
    color:white;
    padding:24px 20px 28px;
    border-radius:0 0 28px 28px;
}

.header-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:21px;
    font-weight:bold;
}

.date{
    margin-top:8px;
    font-size:13px;
    opacity:.85;
}

.container{
    padding:18px;
    max-width:600px;
    margin:auto;
}

.summary{
    background:white;
    border-radius:20px;
    padding:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.summary-title{
    font-size:14px;
    color:#68736f;
}

.percent{
    font-size:38px;
    font-weight:bold;
    margin:5px 0 15px;
    color:#075E54;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.stat{
    text-align:center;
    padding:10px 4px;
    border-radius:12px;
    background:#f5f7f6;
}

.stat-number{
    font-size:20px;
    font-weight:bold;
}

.stat-label{
    font-size:11px;
    margin-top:3px;
    color:#68736f;
}

.section{
    margin-top:25px;
}

.section-title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:12px;
}

.search, .input-field{
    width:100%;
    padding:14px 16px;
    border:none;
    border-radius:14px;
    background:white;
    font-size:14px;
    outline:none;
    box-shadow:0 3px 12px rgba(0,0,0,.04);
}

.btn-primary{
    width:100%;
    padding:14px;
    background:#075E54;
    color:white;
    border:none;
    border-radius:14px;
    font-weight:bold;
    font-size:14px;
    cursor:pointer;
    margin-top:10px;
    box-shadow:0 4px 12px rgba(7,94,84,0.2);
}

.btn-primary:active{
    transform:scale(0.98);
}

.student{
    background:white;
    margin-top:10px;
    padding:15px;
    border-radius:17px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    box-shadow:0 3px 12px rgba(0,0,0,.04);
}

.student-info{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
}

.avatar{
    width:42px;
    height:42px;
    min-width:42px;
    border-radius:50%;
    background:#e5f2ef;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    color:#075E54;
}

.student-name{
    font-weight:bold;
    font-size:14px;
}

.student-class{
    font-size:11px;
    color:#7b8581;
    margin-top:3px;
}

.status-buttons{
    display:flex;
    gap:4px;
}

.status{
    border:none;
    width:32px;
    height:32px;
    border-radius:9px;
    font-size:14px;
    cursor:pointer;
}

.btn-action{
    border:none;
    padding:8px 12px;
    border-radius:10px;
    font-size:12px;
    cursor:pointer;
    font-weight:bold;
}

.btn-edit{ background:#dcecff; color:#0056b3; }
.btn-import{ background:#e5f2ef; color:#075E54; border:1px solid #075E54; }
.btn-toggle{ background:#ffe1e1; color:#a00000; }
.btn-toggle.active-status{ background:#dff5e8; color:#0e6231; }

.present{ background:#dff5e8; }
.permission{ background:#fff2c9; }
.sick{ background:#dcecff; }
.absent{ background:#ffe1e1; }

.status.active{
    outline:2px solid #075E54;
}

.loading{
    text-align:center;
    padding:30px;
    color:#68736f;
}

.error{
    background:#ffe1e1;
    color:#a00000;
    padding:15px;
    border-radius:14px;
    margin-top:15px;
    font-size:13px;
}

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:68px;
    background:white;
    border-top:1px solid #e5e8e7;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:100;
}

.nav-item{
    text-align:center;
    font-size:11px;
    color:#7c8582;
    cursor:pointer;
    flex:1;
}

.nav-item.active{
    color:#075E54;
    font-weight:bold;
}

.nav-icon{
    font-size:21px;
    display:block;
    margin-bottom:3px;
}

.toast{
    position:fixed;
    left:50%;
    bottom:82px;
    transform:translateX(-50%);
    background:#17201e;
    color:white;
    padding:12px 18px;
    border-radius:12px;
    font-size:13px;
    display:none;
    z-index:200;
    text-align:center;
}

/* Modal */
.modal{
    display:none;
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    background:rgba(0,0,0,0.5);
    z-index:300;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal-content{
    background:white;
    width:100%;
    max-width:400px;
    border-radius:20px;
    padding:20px;
}

.modal-title{
    font-weight:bold;
    font-size:16px;
    margin-bottom:15px;
}

.form-group{
    margin-bottom:12px;
}

.form-group label{
    display:block;
    font-size:12px;
    color:#68736f;
    margin-bottom:5px;
}

.modal-buttons{
    display:flex;
    gap:10px;
    margin-top:18px;
}

.btn-cancel{
    background:#e5e8e7;
    color:#17201e;
}

.student.inactive{
    opacity:0.6;
    background:#f0f0f0;
}

.file-info{
    font-size:12px;
    color:#68736f;
    margin-top:8px;
    background:#f5f7f6;
    padding:10px;
    border-radius:10px;
}

@media(max-width:400px){
    .student{ padding:12px; }
    .student-name{ font-size:13px; }
    .status{ width:29px; height:29px; font-size:12px; }
}
</style>
</head>

<body>

<header class="header">
    <div class="header-top">
        <div class="logo">eLKISI ABSENSI</div>
        <div>🔔</div>
    </div>
    <div class="date" id="tanggal"></div>
</header>

<main class="container">

    <!-- HALAMAN BERANDA / ABSENSI -->
    <div id="pageBeranda">
        <section class="summary">
            <div class="summary-title">Kehadiran Hari Ini</div>
            <div class="percent" id="persentase">0%</div>

            <div class="stats">
                <div class="stat">
                    <div class="stat-number" id="hadir">0</div>
                    <div class="stat-label">Hadir</div>
                </div>
                <div class="stat">
                    <div class="stat-number" id="izin">0</div>
                    <div class="stat-label">Izin</div>
                </div>
                <div class="stat">
                    <div class="stat-number" id="sakit">0</div>
                    <div class="stat-label">Sakit</div>
                </div>
                <div class="stat">
                    <div class="stat-number" id="alpha">0</div>
                    <div class="stat-label">Alpha</div>
                </div>
            </div>
        </section>

        <section class="section">
            <div class="section-title">Absensi Santri</div>

            <input class="search" type="text" id="search" placeholder="🔍 Cari nama santri...">
            <select id="filterKelas" class="search" style="margin-top:10px;">
                <option value="">Semua Kelas</option>
            </select>

            <div id="studentList" style="margin-top: 10px;">
                <div class="loading">Menghubungkan ke Firebase...</div>
            </div>
        </section>
    </div>

    <!-- HALAMAN KELOLA SANTRI -->
    <div id="pageSantri" style="display:none;">
        <section class="section" style="margin-top:0;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap; gap:8px;">
                <div class="section-title" style="margin-bottom:0;">Kelola Santri</div>
                <div style="display:flex; gap:6px;">
                    <button class="btn-action btn-import" onclick="bukaModalImport()">📥 Import CSV</button>
                    <button class="btn-action btn-edit" onclick="bukaModalSantri()">+ Tambah</button>
                </div>
            </div>

            <input class="search" type="text" id="searchManage" placeholder="🔍 Cari nama santri...">
            
            <div id="studentManageList" style="margin-top: 10px;">
                <div class="loading">Memuat data santri...</div>
            </div>
        </section>
    </div>

    <div id="errorBox" class="error" style="display:none"></div>
</main>

<nav class="bottom-nav">
    <div class="nav-item active" onclick="pindahHalaman('Beranda')"><span class="nav-icon">🏠</span>Beranda</div>
    <div class="nav-item" onclick="pindahHalaman('Santri')"><span class="nav-icon">👨‍🎓</span>Santri</div>
</nav>

<div class="toast" id="toast"></div>

<!-- MODAL TAMBAH / EDIT SANTRI -->
<div class="modal" id="modalSantri">
    <div class="modal-content">
        <div class="modal-title" id="modalTitle">Tambah Santri</div>
        <form id="formSantri">
            <input type="hidden" id="santriId">
            <div class="form-group">
                <label>Nama Lengkap</label>
                <input type="text" id="namaSantri" class="input-field" required placeholder="Masukkan nama santri">
            </div>
            <div class="form-group">
                <label>Kelas</label>
                <input type="text" id="kelasSantri" class="input-field" required placeholder="Contoh: 7 Azhari">
            </div>
            <div class="form-group">
                <label>Kamar</label>
                <input type="text" id="kamarSantri" class="input-field" placeholder="Contoh: Kamar 01 / -">
            </div>
            <div class="modal-buttons">
                <button type="button" class="btn-primary btn-cancel" onclick="tutupModalSantri()">Batal</button>
                <button type="submit" class="btn-primary" style="margin-top:0;">Simpan</button>
            </div>
        </form>
    </div>
</div>

<!-- MODAL IMPORT CSV -->
<div class="modal" id="modalImport">
    <div class="modal-content">
        <div class="modal-title">Import Data Santri (CSV)</div>
        <form id="formImport">
            <div class="form-group">
                <label>Pilih File CSV</label>
                <input type="file" id="fileCsv" accept=".csv" class="input-field" required style="padding:10px;">
            </div>
            <div class="file-info">
                <strong>Format Kolom Header CSV:</strong><br>
                <code>nama,kelas,kamar</code><br><br>
                Contoh isi CSV:<br>
                <em>Ahmad Fauzi,7 Azhari,Kamar 01</em>
            </div>
            <div class="modal-buttons">
                <button type="button" class="btn-primary btn-cancel" onclick="tutupModalImport()">Batal</button>
                <button type="submit" class="btn-primary" id="btnProsesImport" style="margin-top:0;">Unggah & Simpan</button>
            </div>
        </form>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import { getFirestore, collection, getDocs, addDoc, setDoc, updateDoc, doc, query, where, writeBatch } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyB2zc2-YwgauMiWDlJHMpk00nf7qsMJtnY",
    authDomain: "absensi-santri-b05c2.firebaseapp.com",
    projectId: "absensi-santri-b05c2",
    storageBucket: "absensi-santri-b05c2.firebasestorage.app",
    messagingSenderId: "950602106727",
    appId: "1:950602106727:web:579a6c50a7f897939b51c2",
    measurementId: "G-7R9S1BBHBY"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let santri = [];
let absensiHariIni = {};
let user = null;
let tanggalHariIni = "";
let kelasTerpilih = "";

const sekarang = new Date();
tanggalHariIni = sekarang.toLocaleDateString("sv-SE");

document.getElementById("tanggal").innerText = sekarang.toLocaleDateString("id-ID", {
    weekday: "long", day: "numeric", month: "long", year: "numeric"
});

function toast(pesan){
    const element = document.getElementById("toast");
    element.innerText = pesan;
    element.style.display = "block";
    setTimeout(() => { element.style.display = "none"; }, 3000);
}

function tampilError(pesan){
    const box = document.getElementById("errorBox");
    box.innerText = pesan;
    box.style.display = "block";
}

signInAnonymously(auth).catch((error) => {
    tampilError("Gagal terhubung ke Firebase: " + error.message);
});

onAuthStateChanged(auth, async (currentUser) => {
    if(!currentUser) return;
    user = currentUser;
    await mulaiAplikasi();
});

async function mulaiAplikasi(){
    try{
        await ambilDataSantri();
        siapkanFilterKelas();
        await ambilAbsensi();
        filterSantri();
        hitungStatistik();
    } catch(error){
        tampilError("Terjadi kesalahan: " + error.message);
    }
}

async function ambilDataSantri(){
    const snapshot = await getDocs(collection(db, "santri"));

    if(snapshot.empty){
        const contoh = [
            { nama:"Abdullah Hafiz", kelas:"7 Azhari", kamar:"-", status:"aktif" },
            { nama:"Annas Wafie Nashrullah", kelas:"7 Azhari", kamar:"-", status:"aktif" },
            { nama:"Haritsah Anas", kelas:"7 Azhari", kamar:"-", status:"aktif" }
        ];

        for(const data of contoh){
            await addDoc(collection(db, "santri"), data);
        }

        const baru = await getDocs(collection(db, "santri"));
        santri = baru.docs.map(item => ({ id: item.id, status: "aktif", ...item.data() }));
    } else {
        santri = snapshot.docs.map(item => ({ id: item.id, status: "aktif", ...item.data() }));
    }
}

async function ambilAbsensi(){
    try {
        const q = query(
            collection(db, "absensi"), 
            where("tanggal", "==", tanggalHariIni)
        );
        const snapshot = await getDocs(q);
        absensiHariIni = {};
        snapshot.forEach(doc => {
            const data = doc.data();
            absensiHariIni[data.santriId] = data.status;
        });
    } catch(error) {
        console.error("Gagal mengambil data absensi:", error);
    }
}

function siapkanFilterKelas(){
    const select = document.getElementById("filterKelas");
    if(!select) return;

    const daftarKelas = [...new Set(santri.map(s => s.kelas).filter(k => k))].sort();
    select.innerHTML = `<option value="">Semua Kelas</option>`;

    daftarKelas.forEach(kelas => {
        const option = document.createElement("option");
        option.value = kelas;
        option.textContent = kelas;
        select.appendChild(option);
    });
}

function filterSantri(){
    const keyword = document.getElementById("search").value.toLowerCase().trim();
    const kelas = document.getElementById("filterKelas").value;

    const hasil = santri.filter(s => {
        const cocokNama = s.nama.toLowerCase().includes(keyword);
        const cocokKelas = !kelas || s.kelas === kelas;
        const aktif = s.status !== "nonaktif";
        return cocokNama && cocokKelas && aktif;
    });

    tampilkanSantri(hasil);
}

function tampilkanSantri(data){
    const list = document.getElementById("studentList");
    list.innerHTML = "";

    const santriAktif = data.filter(s => s.status !== "nonaktif");

    if(santriAktif.length === 0){
        list.innerHTML = `<div class="loading">Santri tidak ditemukan / tidak aktif.</div>`;
        return;
    }

    santriAktif.forEach((s) => {
        const status = absensiHariIni[s.id] || "";
        const initial = s.nama.charAt(0).toUpperCase();

        list.innerHTML += `
        <div class="student">
            <div class="student-info">
                <div class="avatar">${initial}</div>
                <div>
                    <div class="student-name">${s.nama}</div>
                    <div class="student-class">${s.kelas}</div>
                </div>
            </div>
            <div class="status-buttons">
                <button class="status present ${status==="hadir"?"active":""}" onclick="ubahStatus('${s.id}', 'hadir')">🟢</button>
                <button class="status permission ${status==="izin"?"active":""}" onclick="ubahStatus('${s.id}', 'izin')">🟡</button>
                <button class="status sick ${status==="sakit"?"active":""}" onclick="ubahStatus('${s.id}', 'sakit')">🔵</button>
                <button class="status absent ${status==="alpha"?"active":""}" onclick="ubahStatus('${s.id}', 'alpha')">🔴</button>
            </div>
        </div>
        `;
    });
}

function tampilkanKelolaSantri(keyword = ""){
    const list = document.getElementById("studentManageList");
    list.innerHTML = "";

    const hasil = santri.filter(s => s.nama.toLowerCase().includes(keyword.toLowerCase().trim()));

    if(hasil.length === 0){
        list.innerHTML = `<div class="loading">Data santri tidak ditemukan.</div>`;
        return;
    }

    hasil.forEach((s) => {
        const initial = s.nama.charAt(0).toUpperCase();
        const isAktif = s.status !== "nonaktif";

        list.innerHTML += `
        <div class="student ${isAktif ? '' : 'inactive'}">
            <div class="student-info">
                <div class="avatar">${initial}</div>
                <div>
                    <div class="student-name">${s.nama} ${isAktif ? '' : '(Nonaktif)'}</div>
                    <div class="student-class">${s.kelas} | Kamar: ${s.kamar || '-'}</div>
                </div>
            </div>
            <div class="status-buttons">
                <button class="btn-action btn-edit" onclick="bukaModalSantri('${s.id}')">Edit</button>
                <button class="btn-action btn-toggle ${isAktif ? '' : 'active-status'}" onclick="toggleStatusSantri('${s.id}')">
                    ${isAktif ? 'Nonaktif' : 'Aktifkan'}
                </button>
            </div>
        </div>
        `;
    });
}

window.ubahStatus = async function(santriId, status){
    try{
        const documentId = tanggalHariIni + "_" + santriId;

        await setDoc(doc(db, "absensi", documentId), {
            santriId: santriId,
            tanggal: tanggalHariIni,
            status: status,
            userId: user.uid,
            updatedAt: new Date().toISOString()
        });

        absensiHariIni[santriId] = status;
        filterSantri();
        hitungStatistik();
        toast("Absensi tersimpan ✓");
    } catch(error){
        toast("Gagal menyimpan");
        tampilError(error.message);
    }
};

function hitungStatistik(){
    let hadir = 0, izin = 0, sakit = 0, alpha = 0;

    const santriAktif = santri.filter(s => s.status !== "nonaktif");
    const daftar = kelasTerpilih 
        ? santriAktif.filter(s => s.kelas === kelasTerpilih) 
        : santriAktif;

    daftar.forEach(s => {
        const status = absensiHariIni[s.id];
        if(status === "hadir") hadir++;
        if(status === "izin") izin++;
        if(status === "sakit") sakit++;
        if(status === "alpha") alpha++;
    });

    const total = daftar.length;
    const persen = total ? Math.round((hadir / total) * 100) : 0;

    document.getElementById("hadir").innerText = hadir;
    document.getElementById("izin").innerText = izin;
    document.getElementById("sakit").innerText = sakit;
    document.getElementById("alpha").innerText = alpha;
    document.getElementById("persentase").innerText = persen + "%";
}

// NAVIGASI
window.pindahHalaman = function(halaman){
    const navItems = document.querySelectorAll('.nav-item');
    navItems.forEach(el => el.classList.remove('active'));

    if(halaman === 'Beranda'){
        document.getElementById('pageBeranda').style.display = 'block';
        document.getElementById('pageSantri').style.display = 'none';
        navItems[0].classList.add('active');
        filterSantri();
        hitungStatistik();
    } else if(halaman === 'Santri'){
        document.getElementById('pageBeranda').style.display = 'none';
        document.getElementById('pageSantri').style.display = 'block';
        navItems[1].classList.add('active');
        tampilkanKelolaSantri();
    }
};

// MODAL MANUAL
window.bukaModalSantri = function(id = null){
    const modal = document.getElementById("modalSantri");
    const title = document.getElementById("modalTitle");

    document.getElementById("formSantri").reset();
    document.getElementById("santriId").value = "";

    if(id){
        const data = santri.find(s => s.id === id);
        if(data){
            title.innerText = "Edit Santri";
            document.getElementById("santriId").value = data.id;
            document.getElementById("namaSantri").value = data.nama;
            document.getElementById("kelasSantri").value = data.kelas;
            document.getElementById("kamarSantri").value = data.kamar || "-";
        }
    } else {
        title.innerText = "Tambah Santri";
    }

    modal.style.display = "flex";
};

window.tutupModalSantri = function(){
    document.getElementById("modalSantri").style.display = "none";
};

// MODAL IMPORT
window.bukaModalImport = function(){
    document.getElementById("formImport").reset();
    document.getElementById("modalImport").style.display = "flex";
};

window.tutupModalImport = function(){
    document.getElementById("modalImport").style.display = "none";
};

// PROSES IMPORT CSV
document.getElementById("formImport").addEventListener("submit", async function(e){
    e.preventDefault();
    const fileInput = document.getElementById("fileCsv");
    const file = fileInput.files[0];

    if(!file) return;

    const btn = document.getElementById("btnProsesImport");
    btn.disabled = true;
    btn.innerText = "Mengunggah...";

    const reader = new FileReader();
    reader.onload = async function(evt){
        try {
            const teks = evt.target.result;
            const baris = teks.split(/\r\n|\n/);
            
            if(baris.length <= 1){
                throw new Error("File CSV kosong atau format tidak sesuai.");
            }

            const header = baris[0].split(',').map(h => h.trim().toLowerCase());
            const idxNama = header.indexOf('nama');
            const idxKelas = header.indexOf('kelas');
            const idxKamar = header.indexOf('kamar');

            if(idxNama === -1 || idxKelas === -1){
                throw new Error("Header CSV harus memiliki kolom 'nama' dan 'kelas'.");
            }

            // Menggunakan Firestore Batch Writer (Maksimal 500 per batch)
            let batch = writeBatch(db);
            let count = 0;
            let totalTersimpan = 0;

            for(let i = 1; i < baris.length; i++){
                const kol = baris[i].split(',').map(k => k.trim());
                if(kol.length < 2 || !kol[idxNama]) continue;

                const santriBaruRef = doc(collection(db, "santri"));
                const dataObj = {
                    nama: kol[idxNama],
                    kelas: kol[idxKelas],
                    kamar: idxKamar !== -1 ? (kol[idxKamar] || '-') : '-',
                    status: 'aktif'
                };

                batch.set(santriBaruRef, dataObj);
                count++;
                totalTersimpan++;

                // Commit setiap 400 dokumen agar aman dari limit Firestore
                if(count === 400){
                    await batch.commit();
                    batch = writeBatch(db);
                    count = 0;
                }
            }

            if(count > 0){
                await batch.commit();
            }

            toast(`Berhasil mengimport ${totalTersimpan} santri!`);
            tutupModalImport();
            await ambilDataSantri();
            siapkanFilterKelas();
            tampilkanKelolaSantri();

        } catch(err){
            toast("Gagal import: " + err.message);
            tampilError("Import Error: " + err.message);
        } finally {
            btn.disabled = false;
            btn.innerText = "Unggah & Simpan";
        }
    };

    reader.readAsText(file);
});

// SIMPAN TAMBAH / EDIT MANUAL
document.getElementById("formSantri").addEventListener("submit", async function(e){
    e.preventDefault();
    const id = document.getElementById("santriId").value;
    const nama = document.getElementById("namaSantri").value.trim();
    const kelas = document.getElementById("kelasSantri").value.trim();
    const kamar = document.getElementById("kamarSantri").value.trim();

    try{
        if(id){
            await updateDoc(doc(db, "santri", id), { nama, kelas, kamar });
            const index = santri.findIndex(s => s.id === id);
            if(index !== -1){
                santri[index].nama = nama;
                santri[index].kelas = kelas;
                santri[index].kamar = kamar;
            }
            toast("Data santri diperbarui ✓");
        } else {
            const docRef = await addDoc(collection(db, "santri"), {
                nama, kelas, kamar, status: "aktif"
            });
            santri.push({ id: docRef.id, nama, kelas, kamar, status: "aktif" });
            toast("Santri berhasil ditambahkan ✓");
        }

        siapkanFilterKelas();
        tutupModalSantri();
        tampilkanKelolaSantri(document.getElementById("searchManage").value);
    } catch(err){
        toast("Gagal menyimpan data");
        tampilError(err.message);
    }
});

// TOGGLE STATUS
window.toggleStatusSantri = async function(id){
    const target = santri.find(s => s.id === id);
    if(!target) return;

    const statusBaru = target.status === "nonaktif" ? "aktif" : "nonaktif";

    try {
        await updateDoc(doc(db, "santri", id), { status: statusBaru });
        target.status = statusBaru;
        
        toast(`Santri di-${statusBaru === "aktif" ? "aktifkan" : "nonaktifkan"} ✓`);
        tampilkanKelolaSantri(document.getElementById("searchManage").value);
        siapkanFilterKelas();
    } catch(err) {
        toast("Gagal mengubah status");
        tampilError(err.message);
    }
};

// EVENT LISTENERS
document.getElementById("search").addEventListener("input", filterSantri);
document.getElementById("searchManage").addEventListener("input", function(){
    tampilkanKelolaSantri(this.value);
});
document.getElementById("filterKelas").addEventListener("change", function(){
    kelasTerpilih = this.value;
    filterSantri();
    hitungStatistik();
});
