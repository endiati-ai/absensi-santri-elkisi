<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
content="#075E54">

<title>Absensi Santri eLKISI</title>


<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f7f6;
    color:#17201e;
    padding-bottom:80px;
}

.header{
    background:#075E54;
    color:white;
    padding:24px 20px 28px;
    border-radius:0 0 28px 28px;
}

.header-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:21px;
    font-weight:bold;
}

.date{
    margin-top:8px;
    font-size:13px;
    opacity:.85;
}

.container{
    padding:18px;
    max-width:600px;
    margin:auto;
}

.summary{
    background:white;
    border-radius:20px;
    padding:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.summary-title{
    font-size:14px;
    color:#68736f;
}

.percent{
    font-size:38px;
    font-weight:bold;
    margin:5px 0 15px;
    color:#075E54;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.stat{
    text-align:center;
    padding:10px 4px;
    border-radius:12px;
    background:#f5f7f6;
}

.stat-number{
    font-size:20px;
    font-weight:bold;
}

.stat-label{
    font-size:11px;
    margin-top:3px;
    color:#68736f;
}

.section{
    margin-top:25px;
}

.section-title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:12px;
}

/* Filter bar: search + dropdown kelas */
.filter-bar{
    display:flex;
    gap:10px;
}

.search{
    flex:2;
    padding:14px 16px;
    border:none;
    border-radius:14px;
    background:white;
    font-size:14px;
    outline:none;
    box-shadow:0 3px 12px rgba(0,0,0,.04);
}

.filter-kelas{
    flex:1;
    padding:14px 12px;
    border:none;
    border-radius:14px;
    background:white;
    font-size:14px;
    outline:none;
    color:#17201e;
    box-shadow:0 3px 12px rgba(0,0,0,.04);
    cursor:pointer;
    appearance:none;
    -webkit-appearance:none;
    background-image:url("data:image/svg+xml,%3Csvg xmlns='[w3.org](http://www.w3.org/2000/svg)' width='12' height='8'%3E%3Cpath d='M1 1l5 5 5-5' stroke='%2368736f' fill='none' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E");
    background-repeat:no-repeat;
    background-position:right 14px center;
    padding-right:32px;
}

.student{
    background:white;
    margin-top:10px;
    padding:15px;
    border-radius:17px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    box-shadow:0 3px 12px rgba(0,0,0,.04);
}

.student-info{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
}

.avatar{
    width:42px;
    height:42px;
    min-width:42px;
    border-radius:50%;
    background:#e5f2ef;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    color:#075E54;
}

.student-name{
    font-weight:bold;
    font-size:14px;
}

.student-class{
    font-size:11px;
    color:#7b8581;
    margin-top:3px;
}

.status-buttons{
    display:flex;
    gap:4px;
}

.status{
    border:none;
    width:32px;
    height:32px;
    border-radius:9px;
    font-size:14px;
    cursor:pointer;
}

.present{
    background:#dff5e8;
}

.permission{
    background:#fff2c9;
}

.sick{
    background:#dcecff;
}

.absent{
    background:#ffe1e1;
}

.status.active{
    outline:2px solid #075E54;
}

.status:disabled{
    opacity:.5;
}

.loading{
    text-align:center;
    padding:30px;
    color:#68736f;
}

.error{
    background:#ffe1e1;
    color:#a00000;
    padding:15px;
    border-radius:14px;
    margin-top:15px;
    font-size:13px;
}

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:68px;
    background:white;
    border-top:1px solid #e5e8e7;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:100;
}

.nav-item{
    text-align:center;
    font-size:11px;
    color:#7c8582;
}

.nav-item.active{
    color:#075E54;
    font-weight:bold;
}

.nav-icon{
    font-size:21px;
    display:block;
    margin-bottom:3px;
}

.toast{
    position:fixed;
    left:50%;
    bottom:82px;
    transform:translateX(-50%);
    background:#17201e;
    color:white;
    padding:12px 18px;
    border-radius:12px;
    font-size:13px;
    display:none;
    z-index:200;
}

@media(max-width:400px){

    .filter-bar{
        flex-direction:column;
        gap:8px;
    }

    .filter-kelas{
        flex:auto;
    }

    .student{
        padding:12px;
    }

    .student-name{
        font-size:13px;
    }

    .status{
        width:29px;
        height:29px;
        font-size:12px;
    }

}

</style>

</head>


<body>


<header class="header">

    <div class="header-top">

        <div class="logo">
            eLKISI ABSENSI
        </div>

        <div>
            🔔
        </div>

    </div>

    <div
        class="date"
        id="tanggal">
    </div>

</header>



<main class="container">


<section class="summary">

    <div class="summary-title">
        Kehadiran Hari Ini
    </div>

    <div
        class="percent"
        id="persentase">
        0%
    </div>


    <div class="stats">

        <div class="stat">

            <div
                class="stat-number"
                id="hadir">
                0
            </div>

            <div class="stat-label">
                Hadir
            </div>

        </div>


        <div class="stat">

            <div
                class="stat-number"
                id="izin">
                0
            </div>

            <div class="stat-label">
                Izin
            </div>

        </div>


        <div class="stat">

            <div
                class="stat-number"
                id="sakit">
                0
            </div>

            <div class="stat-label">
                Sakit
            </div>

        </div>


        <div class="stat">

            <div
                class="stat-number"
                id="alpha">
                0
            </div>

            <div class="stat-label">
                Alpha
            </div>

        </div>

    </div>

</section>



<section class="section">

    <div class="section-title">
        Absensi Santri
    </div>


    <!-- FILTER BAR: SEARCH + PILIHAN KELAS -->
    <div class="filter-bar">

        <input
            class="search"
            type="text"
            id="search"
            placeholder="🔍  Cari nama santri..."
        >

        <select
            class="filter-kelas"
            id="filterKelas">

            <option value="">
                📚 Semua Kelas
            </option>

        </select>

    </div>


    <div id="studentList">

        <div class="loading">
            Menghubungkan ke Firebase...
        </div>

    </div>


    <div
        id="errorBox"
        class="error"
        style="display:none">
    </div>

</section>


</main>



<nav class="bottom-nav">

    <div class="nav-item active">

        <span class="nav-icon">
            🏠
        </span>

        Beranda

    </div>


    <div class="nav-item">

        <span class="nav-icon">
            👨‍🎓
        </span>

        Santri

    </div>


    <div class="nav-item">

        <span class="nav-icon">
            📊
        </span>

        Laporan

    </div>


    <div class="nav-item">

        <span class="nav-icon">
            ⚙️
        </span>

        Pengaturan

    </div>

</nav>



<div
    class="toast"
    id="toast">
</div>



<script type="module">

/* =========================
   FIREBASE
========================= */

import {
    initializeApp
} from "[gstatic.com](https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js)";

import {
    getAuth,
    signInAnonymously,
    onAuthStateChanged
} from "[gstatic.com](https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js)";

import {
    getFirestore,
    collection,
    getDocs,
    addDoc,
    setDoc,
    doc,
    query,
    where,
    deleteDoc
} from "[gstatic.com](https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js)";

/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyB2zc2-YwgauMiWDlJHMpk00nf7qsMJtnY",

    authDomain:
    "absensi-santri-b05c2.firebaseapp.com",

    projectId:
    "absensi-santri-b05c2",

    storageBucket:
    "absensi-santri-b05c2.firebasestorage.app",

    messagingSenderId:
    "950602106727",

    appId:
    "1:950602106727:web:579a6c50a7f897939b51c2",

    measurementId:
    "G-7R9S1BBHBY"

};


/* =========================
   INIT FIREBASE
========================= */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* =========================
   VARIABLES
========================= */

let santri = [];

let absensiHariIni = {};

let user = null;

let tanggalHariIni = "";



/* =========================
   TANGGAL
========================= */

const sekarang = new Date();

tanggalHariIni =
    sekarang.toLocaleDateString(
        "sv-SE"
    );


document.getElementById(
    "tanggal"
).innerText =
    sekarang.toLocaleDateString(
        "id-ID",
        {
            weekday:"long",
            day:"numeric",
            month:"long",
            year:"numeric"
        }
    );



/* =========================
   TOAST
========================= */

function toast(pesan){

    const element =
        document.getElementById("toast");

    element.innerText =
        pesan;

    element.style.display =
        "block";

    setTimeout(() => {

        element.style.display =
            "none";

    },2000);

}



/* =========================
   ERROR
========================= */

function tampilError(pesan){

    const box =
        document.getElementById(
            "errorBox"
        );

    box.innerText =
        pesan;

    box.style.display =
        "block";

}



/* =========================
   LOGIN ANONYMOUS
========================= */

signInAnonymously(auth)
.then(() => {

    console.log(
        "Login Firebase berhasil"
    );

})
.catch((error) => {

    console.error(error);

    tampilError(
        "Gagal terhubung ke Firebase: "
        + error.message
    );

});



/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(
    auth,
    async (currentUser) => {

        if(!currentUser){

            return;

        }

        user =
            currentUser;

        console.log(
            "User:",
            user.uid
        );

        await mulaiAplikasi();

    }
);



/* =========================
   MULAI APLIKASI
========================= */

async function mulaiAplikasi(){

    try{

        await siapkanSantri();

        await ambilAbsensi();

        // ============ ISI DROPDOWN KELAS ============
        isiDropdownKelas();

        tampilkanSantri(
            santri
        );

        hitungStatistik();

    }

    catch(error){

        console.error(error);

        tampilError(
            "Terjadi kesalahan: "
            + error.message
        );

    }

}



/* =========================
   DATA SANTRI
========================= */

async function siapkanSantri(){

    const koleksi = collection(db, "santri");

    // =========================
    // DATA SANTRI DARI EXCEL
    // =========================

    const dataSantri = [

        ["24-14-1764", "ABDUL RASYID AL HAFIDZ", "9A"],
        ["24-14-1765", "ABDULLAH CHOIRUL AZZAM", "9A"],
        ["24-14-1768", "ACHMAD RAFIZA MAULANA IHSAN", "9A"],
        ["24-14-1769", "AHMAD FURQON", "9A"],
        ["24-14-1775", "AKHSAN FAKHRI ABDILA ABIMANA", "9A"],
        ["24-14-1778", "ARRABEL DANENDRA NISWARA", "9A"],
        ["24-14-1779", "ARYA LUHUR DHARMA", "9A"],
        ["24-14-1782", "AZIZI ABDULLAH UMAR", "9A"],
        ["24-14-1788", "FADHIL YAQDAN NASRULLAH", "9A"],
        ["24-14-1789", "FAHMI ANANDA FAJAR SUFANDY", "9A"],
        ["24-14-1792", "FAUZAN RAFFA SETIAWAN", "9A"],
        ["24-14-1793", "GANJAR RAMADHAN PUTRA S.", "9A"],
        ["24-14-1795", "IMAM FAUZAN", "9A"],
        ["24-14-1796", "KENZIE NAUFAL DZAKI HENDRIANTO", "9A"],
        ["24-14-1802", "MOCH. DOMINICO BRIAN", "9A"],
        ["24-14-1803", "MOCH. FARHAN KENZIE", "9A"],
        ["24-14-1810", "MUHAMMAD ARYA ABRISAM", "9A"],
        ["24-14-1814", "MUHAMMAD IBNU SINA", "9A"],
        ["24-14-1816", "MUHAMMAD MUHANDIS ARRABI MUZAIK", "9A"],
        ["24-14-1831", "RAFIF ABISATYA PRADANA", "9A"],
        ["24-14-1833", "RAYNAR AZMI DZIKRA", "9A"],
        ["24-14-1834", "RAYYAN AUFAA PURWANTO", "9A"],
        ["24-14-1835", "VICKY RAHMANSYAH", "9A"],

        ["24-14-1781", "AUFAA AL-FARUQ", "9 Azhari"],
        ["24-14-1784", "BADARUL MUNIR AZHARI", "9 Azhari"],
        ["24-14-1798", "MUHAMMAD ABDUL AZIS AR-RANTISI", "9 Azhari"],
        ["24-14-1812", "MUHAMMAD FAKHRI MUMTAZ", "9 Azhari"]

    ];


    // =========================
    // HAPUS 5 DATA CONTOH
    // =========================

    const snapshotLama = await getDocs(koleksi);

    const namaContoh = [
        "Abdullah Hafiz",
        "Annas Wafie Nashrullah",
        "Haritsah Anas",
        "Ghazi Agha Attaqi",
        "Syafiq Ubaidillah"
    ];

    for (const item of snapshotLama.docs) {

        const data = item.data();

        if (namaContoh.includes(data.nama)) {

            await deleteDoc(
                doc(db, "santri", item.id)
            );

        }

    }


    // =========================
    // MASUKKAN DATA SANTRI
    // =========================

    for (const data of dataSantri) {

        const nis = data[0];
        const nama = data[1];
        const kelas = data[2];

        const cari = query(
            koleksi,
            where("nis", "==", nis)
        );

        const hasil = await getDocs(cari);


        // Jangan buat data ganda
        if (hasil.empty) {

            await addDoc(
                koleksi,
                {
                    nis: nis,
                    nama: nama,
                    kelas: kelas,
                    status: "aktif",
                    dibuatPada: new Date().toISOString()
                }
            );

        }

    }


    // =========================
    // AMBIL DATA TERBARU
    // =========================

    const snapshotBaru =
        await getDocs(koleksi);


    santri =
        snapshotBaru.docs.map(
            item => ({
                id: item.id,
                ...item.data()
            })
        );


    console.log(
        "Jumlah santri:",
        santri.length
    );

}



/* =========================
   ISI DROPDOWN KELAS
========================= */

function isiDropdownKelas(){

    const dropdown =
        document.getElementById("filterKelas");

    // Ambil daftar kelas unik dari data santri, urutkan
    const kelasUnik = [
        ...new Set(
            santri.map(s => s.kelas)
        )
    ].sort();

    // Tambahkan opsi kelas ke dropdown
    kelasUnik.forEach(kelas => {

        const option =
            document.createElement("option");

        option.value =
            kelas;

        option.innerText =
            "📚 " + kelas;

        dropdown.appendChild(option);

    });

}



/* =========================
   AMBIL ABSENSI HARI INI
========================= */

async function ambilAbsensi(){

    absensiHariIni = {};


    const q =
        query(

            collection(
                db,
                "absensi"
            ),

            where(
                "tanggal",
                "==",
                tanggalHariIni
            )

        );


    const snapshot =
        await getDocs(q);


    snapshot.forEach(
        item => {

            const data =
                item.data();

            absensiHariIni[
                data.santriId
            ] =
                data.status;

        }
    );

}



/* =========================
   TAMPILKAN SANTRI
========================= */

function tampilkanSantri(data){

    const list =
        document.getElementById(
            "studentList"
        );

    list.innerHTML = "";


    if(data.length === 0){

        list.innerHTML = `
            <div class="loading">
                Santri tidak ditemukan.
            </div>
        `;

        return;

    }


    data.forEach(
        (s) => {

            const status =
                absensiHariIni[
                    s.id
                ] || "";


            const initial =
                s.nama
                .charAt(0)
                .toUpperCase();


            list.innerHTML += `

            <div class="student">

                <div class="student-info">

                    <div class="avatar">
                        ${initial}
                    </div>


                    <div>

                        <div class="student-name">
                            ${s.nama}
                        </div>

                        <div class="student-class">
                            ${s.kelas}
                        </div>

                    </div>

                </div>


                <div class="status-buttons">

                    <button
                        class="status present
                        ${status==="hadir"?"active":""}"
                        onclick="ubahStatus(
                            '${s.id}',
                            'hadir'
                        )">
                        🟢
                    </button>


                    <button
                        class="status permission
                        ${status==="izin"?"active":""}"
                        onclick="ubahStatus(
                            '${s.id}',
                            'izin'
                        )">
                        🟡
                    </button>


                    <button
                        class="status sick
                        ${status==="sakit"?"active":""}"
                        onclick="ubahStatus(
                            '${s.id}',
                            'sakit'
                        )">
                        🔵
                    </button>


                    <button
                        class="status absent
                        ${status==="alpha"?"active":""}"
                        onclick="ubahStatus(
                            '${s.id}',
                            'alpha'
                        )">
                        🔴
                    </button>

                </div>

            </div>

            `;

        }
    );

}



/* =========================
   UBAH STATUS
========================= */

window.ubahStatus =
async function(
    santriId,
    status
){

    try{

        /*
           ID dokumen dibuat berdasarkan
           tanggal + ID santri.
        */

        const documentId =
            tanggalHariIni
            + "_"
            + santriId;


        await setDoc(

            doc(
                db,
                "absensi",
                documentId
            ),

            {

                santriId:
                    santriId,

                tanggal:
                    tanggalHariIni,

                status:
                    status,

                userId:
                    user.uid,

                updatedAt:
                    new Date().toISOString()

            }

        );


        absensiHariIni[
            santriId
        ] =
            status;


        // Tampilkan ulang dengan filter aktif
        filterDanTampilkan();

        hitungStatistik();

        toast(
            "Absensi tersimpan ✓"
        );

    }

    catch(error){

        console.error(error);

        toast(
            "Gagal menyimpan"
        );

        tampilError(
            error.message
        );

    }

};



/* =========================
   STATISTIK
========================= */

function hitungStatistik(){

    let hadir = 0;
    let izin = 0;
    let sakit = 0;
    let alpha = 0;

    // Statistik tetap dihitung dari SELURUH santri (bukan yang difilter)
    santri.forEach(
        s => {

            const status =
                absensiHariIni[
                    s.id
                ];


            if(status==="hadir")
                hadir++;

            if(status==="izin")
                izin++;

            if(status==="sakit")
                sakit++;

            if(status==="alpha")
                alpha++;

        }
    );


    const total =
        santri.length;


    const persen =
        total
        ? Math.round(
            (hadir / total) * 100
          )
        : 0;


    document.getElementById(
        "hadir"
    ).innerText =
        hadir;


    document.getElementById(
        "izin"
    ).innerText =
        izin;


    document.getElementById(
        "sakit"
    ).innerText =
        sakit;


    document.getElementById(
        "alpha"
    ).innerText =
        alpha;


    document.getElementById(
        "persentase"
    ).innerText =
        persen + "%";

}



/* =========================
   FILTER GABUNGAN: PENCARIAN + KELAS
========================= */

function filterDanTampilkan(){

    const keyword =
        document.getElementById("search")
        .value
        .toLowerCase();

    const kelasDipilih =
        document.getElementById("filterKelas")
        .value;


    const hasil =
        santri.filter(s => {

            const cocokNama =
                !keyword
                || s.nama
                    .toLowerCase()
                    .includes(keyword);

            const cocokKelas =
                !kelasDipilih
                || s.kelas === kelasDipilih;

            return cocokNama && cocokKelas;

        });


    tampilkanSantri(hasil);

}



/* =========================
   EVENT LISTENER — PENCARIAN
========================= */

document.getElementById(
    "search"
).addEventListener(
    "input",
    filterDanTampilkan
);



/* =========================
   EVENT LISTENER — DROPDOWN KELAS
========================= */

document.getElementById(
    "filterKelas"
).addEventListener(
    "change",
    filterDanTampilkan
);


</script>

</body>
</html>
